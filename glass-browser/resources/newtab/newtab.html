<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab — Glass Browser</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- Full-screen background image -->
  <div id="background-layer">
    <img id="bg-image" src="" alt="" />
    <div id="bg-overlay"></div>
  </div>

  <!-- Main content container -->
  <main id="content">
    <!-- Search Section -->
    <section id="search-section">
      <div id="search-container" class="glass-surface">
        <svg id="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search with Bing"
          autocomplete="off"
          autofocus
        />
        <kbd id="search-hint" class="glass-pill">Enter</kbd>
      </div>
    </section>

    <!-- Bookmarks Grid -->
    <section id="bookmarks-section">
      <div id="bookmarks-grid">
        <!-- Bookmarks rendered by JS -->
      </div>
      <button id="bookmarks-edit-btn" class="glass-pill-btn" title="Edit bookmarks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        Edit
      </button>
    </section>

    <!-- Discovery Feed -->
    <section id="feed-section">
      <div id="feed-header">
        <h2 id="feed-title" class="glass-text-large">Discover</h2>
        <div id="feed-controls">
          <button id="feed-settings-btn" class="glass-icon-btn" title="Feed settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <button id="feed-refresh-btn" class="glass-icon-btn" title="Refresh feed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="feed-grid">
        <!-- Feed articles rendered by JS -->
      </div>
      <div id="feed-loading" class="glass-surface" style="display:none;">
        <div class="loading-pulse"></div>
        <span>Loading stories...</span>
      </div>
    </section>
  </main>

  <!-- Feed Settings Modal -->
  <div id="feed-settings-modal" class="modal-overlay" style="display:none;">
    <div id="feed-settings-panel" class="glass-panel">
      <div class="modal-header">
        <h3>Feed Preferences</h3>
        <button id="feed-settings-close" class="glass-icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-description">Select topics to personalize your discovery feed. Your browsing history will also be used to surface relevant articles.</p>
        <div id="topic-chips">
          <!-- Topic chips rendered by JS -->
        </div>
        <div class="modal-divider"></div>
        <div class="setting-row">
          <span class="setting-label">Use browsing history</span>
          <label class="glass-toggle">
            <input type="checkbox" id="history-toggle" checked />
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Show sponsored content</span>
          <label class="glass-toggle">
            <input type="checkbox" id="ads-toggle" checked />
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Feed refresh interval</span>
          <select id="refresh-interval" class="glass-select">
            <option value="15">15 minutes</option>
            <option value="30" selected>30 minutes</option>
            <option value="60">1 hour</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="feed-settings-save" class="glass-btn-primary">Save Preferences</button>
      </div>
    </div>
  </div>

  <!-- Bookmark Edit Modal -->
  <div id="bookmark-edit-modal" class="modal-overlay" style="display:none;">
    <div id="bookmark-edit-panel" class="glass-panel">
      <div class="modal-header">
        <h3>Edit Bookmarks</h3>
        <button id="bookmark-edit-close" class="glass-icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="bookmark-edit-list">
          <!-- Editable bookmark list rendered by JS -->
        </div>
        <button id="bookmark-add-btn" class="glass-btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Bookmark
        </button>
      </div>
      <div class="modal-footer">
        <button id="bookmark-edit-save" class="glass-btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="feed-service.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
