<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab — Glass Browser</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>

  <!-- BG: gradient base + optional photo + dark overlay for depth -->
  <div id="bg">
    <div id="bg-gradient"></div>
    <img id="bg-photo" src="" alt="" />
    <div id="bg-overlay"></div>
  </div>

  <main id="page">

    <!-- ===== Search ===== -->
    <section id="search-section">
      <div id="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Search with Bing" autocomplete="off" autofocus />
        <kbd id="search-kbd">↵</kbd>
      </div>
    </section>

    <!-- ===== Bookmarks ===== -->
    <section id="bookmarks-section">
      <div id="bookmarks-grid"></div>
      <button id="bm-edit-btn" class="pill-btn" title="Edit bookmarks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        Edit
      </button>
    </section>

    <!-- ===== Discovery Feed ===== -->
    <section id="feed-section">
      <header id="feed-header">
        <h2 id="feed-title">Discover</h2>
        <div id="feed-actions">
          <button id="feed-settings-btn" class="icon-btn" title="Feed settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <button id="feed-refresh-btn" class="icon-btn" title="Refresh feed">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
        </div>
      </header>
      <div id="feed-grid"></div>
    </section>

  </main>

  <!-- ===== Feed Settings Modal ===== -->
  <div id="settings-modal" class="modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h3>Feed Preferences</h3>
        <button id="settings-close" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Choose topics for your feed. Browsing history can also personalize results.</p>
        <div id="topic-chips"></div>
        <hr class="modal-rule"/>
        <label class="row"><span>Use browsing history</span>
          <span class="toggle"><input type="checkbox" id="opt-history" checked/><span class="track"></span></span>
        </label>
        <label class="row"><span>Sponsored content</span>
          <span class="toggle"><input type="checkbox" id="opt-ads" checked/><span class="track"></span></span>
        </label>
        <label class="row"><span>Refresh interval</span>
          <select id="opt-interval" class="glass-select">
            <option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">1 hour</option>
          </select>
        </label>
      </div>
      <div class="modal-foot">
        <button id="settings-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== Bookmark Edit Modal ===== -->
  <div id="bm-modal" class="modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h3>Edit Bookmarks</h3>
        <button id="bm-close" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="bm-edit-list"></div>
        <button id="bm-add" class="btn-secondary">+ Add Bookmark</button>
      </div>
      <div class="modal-foot">
        <button id="bm-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
