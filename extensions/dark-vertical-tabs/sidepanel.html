<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Tabs</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="tab-sidebar">
    <div id="sidebar-header">
      <div id="logo-mark"></div>
      <span id="header-title">TABS</span>
      <button id="new-tab-btn" title="New Tab">+</button>
    </div>
    <div id="search-container">
      <input type="text" id="tab-search" placeholder="SEARCH TABS" autocomplete="off" spellcheck="false">
    </div>
    <div id="tab-list"></div>
    <div id="sidebar-footer">
      <div id="tab-count">0 TABS</div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
